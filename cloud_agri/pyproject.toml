[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-cloud"
version = "0.1.0"
description = "Smart-agriculture: a mobile robot node reporting sealed plant measurements to a Cloud"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",   # ECDH / ECDSA / AES-GCM  (agri.crypto_ecc)
    "qrcode>=7.4",        # QR encoding             (agri.qrcodec)
    "pillow>=10",         # images                  (qrcode, photos)
    "paho-mqtt>=1.6",     # robot <-> Cloud transport
    "numpy>=1.24",
]

[project.optional-dependencies]
# The Cloud verifies every QR it receives, so it needs a DECODER. zxing-cpp
# is listed first because it reads all 48 station codes; OpenCV's detector
# fails to locate two of them (see agri/qrcodec.py). Either alone will work,
# both together is what the test suite runs against.
#
# THE UPPER BOUND ON OPENCV IS NOT COSMETIC. opencv-python-headless 5.x
# declares numpy>=2, and installing it into a --system-site-packages venv on
# top of ROS 2 Jazzy shadows the system numpy 1.26 that every rosidl Python
# extension was COMPILED against. The result is not a warning; it is
# "A module that was compiled using NumPy 1.x cannot be run in NumPy 2.x"
# the first time a LaserScan or an Odometry is deserialised -- i.e. after
# the simulator is up, from inside a callback, which is the worst place to
# discover a packaging problem. 4.x asks only for numpy>=1.26 and coexists.
#
# zxing-cpp has no numpy dependency at all, which is the other reason it is
# the primary decoder rather than the fallback.
cloud = ["zxing-cpp>=2.2", "opencv-python-headless>=4.8,<5"]

[project.scripts]
agri-cloud = "agri.cloud.server:main"
agri-demo = "agri.demo:main"
agri-world = "agri.world.make_world:main"
agri-keys = "agri.keys:main"

[tool.setuptools.packages.find]
include = ["agri*"]

[tool.setuptools.package-data]
"agri.cloud" = ["dashboard/*"]
