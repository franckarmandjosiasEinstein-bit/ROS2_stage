# mosquitto.conf -- the broker as a deployment should run it.
#
# NOT what the demonstration uses. `mosquitto -p 1883 -v` on one laptop is
# fine for showing a robot drive, and this file is what the same system
# needs the day the Cloud and the robot are on two machines on a network
# somebody else can also reach.
#
#   mosquitto -c deploy/mosquitto.conf -v
#
# Both programs then need the matching flags:
#
#   agri-cloud --broker gh.example --broker-ca ca.crt \
#              --broker-cert cloud.crt --broker-key cloud.key
#   ros2 run agri_robot robot_node --ros-args \
#              -p broker:=gh.example -p broker_ca:=ca.crt \
#              -p broker_cert:=robot.crt -p broker_key:=robot.key
#
# See deploy/README.md for how to make those five files.

# ------------------------------------------------------------- the port
# 8883 is the IANA port for MQTT over TLS. 1883 is not listed at all: a
# broker that still answers on the plain port is a broker every client can
# still reach in the clear, and one misconfigured client is all it takes.
listener 8883

# --------------------------------------------------------------- the TLS
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile  /etc/mosquitto/certs/broker.key

# Every client must present a certificate this CA signed. Without it, TLS
# would encrypt the link and authenticate the BROKER to the clients, and
# leave any stranger on the network free to connect and publish -- which is
# most of what the transport was supposed to fix.
require_certificate true

# Use the certificate's Common Name as the MQTT username. This is what
# makes the ACL below possible without a second password database: the
# identity is the certificate, and it cannot be typed wrong.
use_identity_as_username true

# ----------------------------------------------------------------- who
allow_anonymous false
acl_file /etc/mosquitto/acl

# -------------------------------------------------------------- limits
# A node holds at most one campaign's worth of readings, each with a
# photograph. 512 kB is generous for one and refuses a client trying to
# exhaust the broker's memory with a single publish.
message_size_limit 524288

# Keep the retained status messages and nothing else across a restart.
persistence true
persistence_location /var/lib/mosquitto/

log_type error
log_type warning
log_type notice
