# Parameters for the YouBot control stack. Each top-level key is a node
# name; ROS 2 delivers the nested values to that node's declared parameters.
# Tuned values are carried over from the validated Webots controller.

mapping_node:
  ros__parameters:
    resolution: 0.10       # metres per cell
    arena_size: 10.0       # grid side (m); the 10x5 greenhouse fits inside
    inflation: 0.18        # padding for the 0.8 m aisles: keeps A* on the aisle
                           # centre (robot ~0.38 m wide) without blocking it
    publish_period: 0.5    # seconds between /map publications

planning_node:
  ros__parameters:
    resolution: 0.10
    arena_size: 10.0

navigation_node:
  ros__parameters:
    # Faster now that the guard below is trustworthy. The old brake never
    # filtered the robot's own arm column out of the scan, saw it at 0.07 m
    # forever and sat on its 35 % floor: the base crawled at 0.16 m/s all run,
    # whatever cruise_speed said.
    lookahead: 0.32        # short enough to hug the plan in a 0.8 m aisle
    cruise_speed: 0.60     # m/s along the lookahead vector
    control_period: 0.05   # 20 Hz control loop
    # Obstacle braking and the arena fence moved to safety_node: one guard for
    # every publisher, one boundary. Two of them disagreeing is what pinned the
    # robot on x = -4.30 for a whole run. What stays here is the stuck detector.
    stuck_speed: 0.03      # m/s: commanded above this but not moving = jammed
    stuck_time: 4.0        # s of that before the escape manoeuvre fires
    recover_time: 2.0      # s of reverse + turn

safety_node:
  ros__parameters:
    # The single protective stop: every publisher writes /cmd_vel_raw, only
    # this node writes /cmd_vel.
    stop_distance: 0.28    # m ahead along the path -> translation cancelled
    slow_distance: 0.60    # m: start scaling the translation down
    half_width: 0.24       # m: half-width of the corridor the base sweeps
    min_valid_range: 0.30  # m: below this the lidar is seeing our own body
    side_min: 0.30         # m: flank clearance held while translating
    side_push: 0.12        # m/s: max recentring correction
    side_band: 0.35        # m: fore/aft extent of the flank measurement
    # The wall the FOOTPRINT must stay inside (inner glass faces 4.95 / 2.45,
    # 0.10 m of margin). All four corners are checked, rotated by the heading:
    # bounding the centre alone let the chassis clip the glass on a diagonal.
    fence_x: 4.85
    fence_y: 2.35
    base_length: 0.58
    base_width: 0.38
    cmd_timeout: 1.0       # s of silence -> stop, never coast
