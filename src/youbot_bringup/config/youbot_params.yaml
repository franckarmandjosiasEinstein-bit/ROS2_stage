# Parameters for the YouBot control stack. Each top-level key is a node
# name; ROS 2 delivers the nested values to that node's declared parameters.
# Tuned values are carried over from the validated Webots controller.

mapping_node:
  ros__parameters:
    resolution: 0.10       # metres per cell
    arena_size: 10.0       # grid side (m); the 10x5 greenhouse fits inside
    inflation: 0.18        # padding for the 0.8 m aisles: keeps A* on the aisle
                           # centre (robot ~0.38 m wide) without blocking it
    publish_period: 0.5    # seconds between /map publications

planning_node:
  ros__parameters:
    resolution: 0.10
    arena_size: 10.0

navigation_node:
  ros__parameters:
    lookahead: 0.25        # short -> hugs the plan, less corner-cutting in aisles
    cruise_speed: 0.45     # m/s along the lookahead vector
    control_period: 0.05   # 20 Hz control loop
    # Reactive safety brake off the lidar (anti wall-crash in tight aisles):
    safety_stop: 0.15      # m: hardest braking if an obstacle is this close ahead
    safety_slow: 0.45      # m: start slowing from here
    safety_halfcone: 0.30  # rad: half-angle of the forward danger cone (~17 deg)
    safety_min: 0.35       # never brake below this -> slows but never freezes
