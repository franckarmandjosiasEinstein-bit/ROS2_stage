# Industrial-comparison configuration: slam_toolbox on the YouBot.
# Install (on the robot PC):  sudo apt install ros-jazzy-slam-toolbox
# Run alongside the stack:    ros2 launch youbot_slam slam_toolbox.launch.py
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # --- frames / topics: match the youbot_slam wiring ----------------------
    odom_frame: odom            # drifting frame maintained by noisy_odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping               # online SLAM (localise while building)

    # --- solver -------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI

    # --- tuned for a small 10 x 5 m indoor arena ----------------------------
    resolution: 0.05
    max_laser_range: 12.0
    map_update_interval: 2.0
    transform_publish_period: 0.05
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
