# ros_gz_bridge topic map between Gazebo Harmonic and ROS 2.
# Each entry pairs a gz transport topic with its ROS 2 equivalent.

# Simulation clock -> ROS (drives use_sim_time across the stack).
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Velocity command: ROS control stack -> Gazebo VelocityControl.
#
# The ROS side is /cmd_vel_exec, NOT /cmd_vel. drive_model_node sits between
# them and models the drivetrain (latency, first-order lag, per-wheel rate and
# speed limits, slip). With enabled:=false it is a byte-for-byte pass-through,
# so this indirection costs nothing and the kinematic baseline is unchanged.
#
# drive_model_node must therefore ALWAYS be running or the base receives no
# command at all. check_regressions.py enforces that the launch files start it
# and that this entry names the topic it publishes.
- ros_topic_name: "/cmd_vel_exec"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Ground-truth odometry: Gazebo OdometryPublisher -> ROS.
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Lidar scan: Gazebo gpu_lidar -> ROS.
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# RGB camera image: Gazebo camera sensor -> ROS. The sensor's <topic> is
# "camera", so gz publishes the image on /camera and info on /camera/camera_info.
- ros_topic_name: "/camera/image"
  gz_topic_name: "/camera"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Joint states (GZ -> ROS): gives the MEASURED camera pan angle. The detector
# uses it instead of a constant, and refuses to publish world positions while
# the head has not settled.
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/greenhouse/model/youbot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Camera pan head command: ROS Float64 -> gz Double, radians, clamped to
# +/- 1.5708 by the joint limit in the URDF. Publish a HELD target and wait for
# the head to settle before using an image: the pan angle enters the fruit
# back-projection in series with the robot yaw, so a frame grabbed mid-sweep
# carries an unknown angle straight into the estimated fruit position.
- ros_topic_name: "/camera_pan_cmd"
  gz_topic_name: "/camera_pan_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Arm + gripper joint position commands: ROS Float64 -> gz Double, one per
# JointPositionController. arm_node publishes the pick-sequence targets here.
- ros_topic_name: "/arm_joint_1_cmd"
  gz_topic_name: "/arm_joint_1_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm_joint_2_cmd"
  gz_topic_name: "/arm_joint_2_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm_joint_3_cmd"
  gz_topic_name: "/arm_joint_3_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm_joint_4_cmd"
  gz_topic_name: "/arm_joint_4_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm_joint_5_cmd"
  gz_topic_name: "/arm_joint_5_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/gripper_left_cmd"
  gz_topic_name: "/gripper_left_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/gripper_right_cmd"
  gz_topic_name: "/gripper_right_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# NOTE: map -> base_link TF is NOT bridged from gz here. The gz Pose_V->TF
# bridge could deliver it on wall time and make RViz thrash. Instead the
# odom_tf node rebroadcasts it from /odom on sim time. robot_state_publisher
# supplies base_link -> wheels/arm/lidar/camera.
